<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藏书阁</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 开场交互层 -->
  <div class="landing">
    <h1 class="landing-title">藏 书 阁</h1>
    <p class="landing-notice">&#128227; 文本内容较多，首次加载较慢，请多等一下</p>
    <button class="btn-enter" id="btn-enter">进 入 藏 书 阁</button>
  </div>

  <script src="js/particles.js"></script>
  <script>
    // 初始化粒子系统
    const particleSystem = initParticles();

    // 前往新站
    document.getElementById('btn-enter').addEventListener('click', () => {
      if (particleSystem) particleSystem.destroy();
      window.location.href = 'https://polytropy.dpdns.org/';
    });
  </script>
</body>
</html>
